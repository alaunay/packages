name: publish

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c dpkg-dev gettext gnupg rpm

      - name: Import the signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$REPO_GPG_PRIVATE_KEY" ]; then
            echo "REPO_GPG_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          printf '%s\n' "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Collect the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          : > dist/projects.txt
          while read -r project; do
            [ -n "$project" ] || continue
            tag=$(gh release view --repo "$project" --json tagName --jq .tagName) || {
              echo "$project: no release, skipped" >&2
              continue
            }
            echo "$project: $tag"
            printf '%s\t%s\n' "$project" "$tag" >> dist/projects.txt
            mkdir -p "dist/$project"
            gh release download "$tag" --repo "$project" --dir "dist/$project" \
              --pattern "*.deb" --pattern "*.rpm" || true
          done < projects.txt

      - name: Build the repositories
        env:
          REPO_GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
          REPO_ORIGIN: alaunay
          REPO_LABEL: Alaunay packages
          REPO_BASE_URL: https://alaunay.github.io/packages
        run: tools/build-repo.sh dist site

      - name: Record the collected versions
        # watch.yml reads this file to tell whether a project has a release
        # that the published repositories do not carry yet.
        run: |
          {
            printf '{\n'
            first=1
            while IFS=$'\t' read -r project tag; do
              [ -n "$project" ] || continue
              if [ "$first" -eq 1 ]; then
                first=0
              else
                printf ',\n'
              fi
              printf '  "%s": "%s"' "$project" "$tag"
            done < dist/projects.txt
            printf '\n}\n'
          } > site/projects.json
          cat site/projects.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # deploy-pages lists the artifacts of the run through a run-scoped
          # API that can trail the upload, and it errors on zero artifact or on
          # more than one. A rerun of the failed job uploads a second artifact,
          # so delete the stale ones and keep the newest.
          count() {
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length'
          }
          for _ in $(seq 1 30); do
            found=$(count)
            if [ "$found" -gt 1 ]; then
              gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
                --jq '[.artifacts[] | select(.name == "github-pages")]
                      | sort_by(.created_at) | .[:-1] | .[].id' |
                while read -r id; do
                  echo "deleting stale artifact $id"
                  gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
                done
              sleep 2
              continue
            fi
            if [ "$found" -eq 1 ]; then
              # The deploy step reads the artifact through another API, which
              # can trail the listing above. Let the upload settle first.
              sleep 5
              echo "Pages artifact is visible"
              exit 0
            fi
            sleep 2
          done
          echo "Pages artifact did not become visible" >&2
          exit 1

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
