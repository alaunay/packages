name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils bats createrepo-c dpkg-dev gnupg rpm shellcheck

      - name: Shellcheck
        run: shellcheck tools/build-repo.sh

      - name: Test the builder
        run: bats tests
